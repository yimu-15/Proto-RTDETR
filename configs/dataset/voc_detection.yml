      type: Compose
      ops: ~
  shuffle: True
  batch_size: 4
  num_workers: 2
  drop_last: True

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:/Proto-RTDETR/datasets/visa/VisA/data/VisA_20220922
    ann_file: D:/Proto-RTDETR/datasets/visa/annotations/test.json
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  batch_size: 4
  num_workers: 2
  drop_last: False