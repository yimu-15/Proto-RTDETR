task: detection

num_classes: 1
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:/Proto-RTDETR/datasets/visa/VisA/data/VisA_20220922
    ann_file: D:/Proto-RTDETR/datasets/visa/annotations/train.json
